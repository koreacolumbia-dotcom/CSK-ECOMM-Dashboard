<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSK E-COMM | AUTOMATION MARKETING HUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap');
    :root { --brand:#002d72; --bg0:#f6f8fb; --bg1:#eef3f9; }
    body{background:linear-gradient(180deg,var(--bg0),var(--bg1));font-family:'Plus Jakarta Sans',sans-serif;color:#0f172a;min-height:100vh}
    .glass-card{background:rgba(255,255,255,.60);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.75);border-radius:28px;box-shadow:0 20px 50px rgba(0,45,114,.06)}
    .sidebar{background:rgba(255,255,255,.72);backdrop-filter:blur(16px);border-right:1px solid rgba(255,255,255,.85)}
    .nav-item{border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:800;transition:.15s;cursor:pointer;user-select:none}
    .nav-item.active{background:#fff;color:var(--brand);box-shadow:0 10px 20px rgba(0,45,114,.06)}
    .nav-item:not(.active){color:#94a3b8}.nav-item:not(.active):hover{background:rgba(255,255,255,.55);color:#334155}
    .nav-section{margin-top:18px}.nav-section:first-child{margin-top:0}.nav-section-title{font-size:10px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:#94a3b8;padding:0 10px;margin-bottom:10px}.nav-divider{height:1px;background:rgba(148,163,184,.22);margin:14px 10px}.nav-item i{width:18px;text-align:center;font-size:14px}
    .mo-tabbar{background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.85)}.mo-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border-radius:16px;font-weight:900;transition:.15s;color:#94a3b8;cursor:pointer;white-space:nowrap}.mo-tab.active{color:var(--brand);background:rgba(0,45,114,.06)}.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
    .loading-overlay{position:fixed;inset:0;background:rgba(248,250,252,.72);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:9999}.spinner{width:42px;height:42px;border-radius:999px;border:4px solid rgba(0,0,0,.1);border-top-color:rgba(0,45,114,.85);animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.muted{color:#64748b}#frame{overflow:hidden;background:#fff}
  </style>
</head>
<body class="flex">
<div class="loading-overlay" id="hub-loading"><div class="glass-card px-6 py-5 flex items-center gap-4"><div class="spinner"></div><div><div class="text-sm font-black">리포트 불러오는 중…</div><div class="text-xs font-semibold muted mt-1">잠시만요</div></div></div></div>
<aside class="w-72 h-screen sticky top-0 sidebar hidden lg:flex flex-col p-8">
  <div class="flex items-center gap-4 mb-10 px-2"><img src="Columbia_logo.png" alt="Columbia" class="w-14 h-14 object-contain"/><div><div class="text-xl font-black tracking-tight">CSK <span class="text-blue-600">E-COMM</span></div><div class="text-[9px] font-black uppercase tracking-[0.3em] text-slate-400">AUTOMATION MARKETING HUB</div></div></div>
  <div>
    <div class="nav-section"><div class="nav-section-title">Overview</div><div class="space-y-3">
      <div class="nav-item active" data-key="summary" data-target="reports/index.html"><i class="fa-solid fa-chart-simple"></i><span>Summary</span></div>
      <div class="nav-item" data-key="performance" data-target="reports/performance_dashboard.html"><i class="fa-solid fa-chart-line"></i><span>Performance</span></div>
      <div class="nav-item" data-key="daily" data-target="reports/daily_digest/index.html"><i class="fa-solid fa-calendar-day"></i><span>Owned.com Report</span></div>
      <div class="nav-item" data-key="owned" data-target="reports/owned_portal/index.html"><i class="fa-solid fa-envelope"></i><span>OWNED MESSAGE</span></div>
    </div></div>
    <div class="nav-divider"></div>
    <div class="nav-section"><div class="nav-section-title">Price & Competitor</div><div class="space-y-3">
      <div class="nav-item" data-key="price" data-target="reports/naver_lowest_price.html"><i class="fa-solid fa-won-sign"></i><span>네이버 최저가</span></div>
      <div class="nav-item" data-key="hero" data-target="reports/hero_main.html"><i class="fa-solid fa-image"></i><span>경쟁사 기획전 배너</span></div>
    </div></div>
    <div class="nav-divider"></div>
    <div class="nav-section"><div class="nav-section-title">VOC</div><div class="space-y-3">
      <div class="nav-item" data-key="voc" data-target="reports/external_signal.html"><i class="fa-solid fa-tower-broadcast"></i><span>디시인사이드</span></div>
      <div class="nav-item" data-key="crema" data-target="reports/voc_crema/index.html"><i class="fa-solid fa-comments"></i><span>구매후기</span></div>
      <div class="nav-item" data-key="blogvoc" data-target="reports/voc_blog/index.html"><i class="fa-solid fa-pen-nib"></i><span>네이버 블로그</span></div>
    </div></div>
  </div>
  <div class="mt-auto pt-8 px-2"><div class="glass-card p-4"><div class="text-[10px] font-black tracking-widest text-slate-500 uppercase">Update</div><div class="mt-3 space-y-2"><div class="flex items-center justify-between gap-3"><div class="text-[10px] font-extrabold text-slate-400">업데이트</div><div id="sb-updated-at" class="text-[11px] font-black text-slate-700 text-right">-</div></div><div class="flex items-center justify-between gap-3"><div class="text-[10px] font-extrabold text-slate-400">기간</div><div id="sb-period" class="text-[11px] font-black text-slate-700 text-right">-</div></div></div></div><div class="pt-4 text-[10px] text-slate-400 font-bold">© CSK E-COMM</div></div>
</aside>
<main class="flex-1 p-4 md:p-8 lg:p-10 pb-24 lg:pb-0"><section class="glass-card p-3 md:p-4 lg:p-5"><iframe id="frame" src="reports/index.html" class="w-full rounded-2xl border-0 bg-white" style="min-height:760px" loading="eager"></iframe></section></main>
<nav class="lg:hidden fixed bottom-0 left-0 right-0 mo-tabbar safe-bottom px-3 py-3"><div class="max-w-3xl mx-auto grid grid-cols-9 gap-1">
  <div class="mo-tab active" data-key="summary" data-target="reports/index.html"><i class="fa-solid fa-chart-simple text-base"></i><div class="text-[9px]">요약</div></div>
  <div class="mo-tab" data-key="performance" data-target="reports/performance_dashboard.html"><i class="fa-solid fa-chart-line text-base"></i><div class="text-[9px]">성과</div></div>
  <div class="mo-tab" data-key="daily" data-target="reports/daily_digest/index.html"><i class="fa-solid fa-calendar-day text-base"></i><div class="text-[9px]">데일리</div></div>
  <div class="mo-tab" data-key="owned" data-target="reports/owned_portal/index.html"><i class="fa-solid fa-envelope text-base"></i><div class="text-[9px]">OWNED</div></div>
  <div class="mo-tab" data-key="price" data-target="reports/naver_lowest_price.html"><i class="fa-solid fa-won-sign text-base"></i><div class="text-[9px]">최저가</div></div>
  <div class="mo-tab" data-key="hero" data-target="reports/hero_main.html"><i class="fa-solid fa-image text-base"></i><div class="text-[9px]">배너</div></div>
  <div class="mo-tab" data-key="voc" data-target="reports/external_signal.html"><i class="fa-solid fa-tower-broadcast text-base"></i><div class="text-[9px]">커뮤</div></div>
  <div class="mo-tab" data-key="crema" data-target="reports/voc_crema/index.html"><i class="fa-solid fa-comments text-base"></i><div class="text-[9px]">후기</div></div>
  <div class="mo-tab" data-key="blogvoc" data-target="reports/voc_blog/index.html"><i class="fa-solid fa-pen-nib text-base"></i><div class="text-[9px]">블로그</div></div>
</div></nav>
<script>
(function(){
 const frame=document.getElementById('frame'),pc=[...document.querySelectorAll('.nav-item[data-target]')],mo=[...document.querySelectorAll('.mo-tab[data-target]')],all=[...pc,...mo],loading=document.getElementById('hub-loading'); if(!frame)return;
 const meta={summary:'reports/meta.json',daily:'reports/meta.json',owned:'reports/owned_portal/data/meta.json',price:'reports/meta.json',hero:'reports/meta.json',voc:'reports/meta.json',crema:'reports/voc_crema/data/meta.json',blogvoc:'reports/voc_blog/data/meta.json'};
 const show=v=>{if(loading)loading.style.display=v?'flex':'none'};
 function active(target){all.forEach(x=>x.classList.toggle('active',x.dataset.target===target))}
 function keyFor(target){const x=all.find(y=>y.dataset.target===target);return x?x.dataset.key:''}
 function resize(){try{const d=frame.contentDocument||frame.contentWindow.document;if(!d)return;d.documentElement.style.overflow='hidden';d.body.style.overflow='hidden';d.body.style.margin='0';frame.style.height=(Math.max(d.body.scrollHeight,d.documentElement.scrollHeight,d.body.offsetHeight,d.documentElement.offsetHeight)+12)+'px'}catch(e){}}
 async function setMeta(key){const u=document.getElementById('sb-updated-at'),p=document.getElementById('sb-period');if(!u||!p)return;if(key==='performance'){u.textContent='Performance Builder';p.textContent='최근 31일 + YoY';return}try{const r=await fetch((meta[key]||'reports/meta.json')+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();u.textContent=j.updated_at_kst||'-';p.textContent=j.period_text||'-'}catch(e){u.textContent='-';p.textContent='-'}}
 function go(target){if(!target)return;const k=keyFor(target);show(true);const done=()=>{show(false);frame.removeEventListener('load',done);resize();setTimeout(resize,250);setTimeout(resize,900)};frame.addEventListener('load',done);frame.src=new URL(target,location.href).href;active(target);if(k)location.hash=k;setMeta(k)}
 all.forEach(x=>x.addEventListener('click',()=>go(x.dataset.target)));
 const hk=(location.hash||'').replace('#','').trim(),el=all.find(x=>x.dataset.key===hk);go(el?el.dataset.target:frame.getAttribute('src')); window.addEventListener('resize',resize);
})();
</script>
</body>
</html>
